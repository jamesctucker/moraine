name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Python — test + lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; major-version tags are mutable.
      # Update pins via Dependabot (github-actions ecosystem, .github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/workspace/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r scripts/workspace/requirements.txt

      - name: Lint with ruff
        run: ruff check tests/ scripts/

      - name: Test with pytest
        run: python -m pytest tests/ --tb=short -q

  test-node:
    name: Node — vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Dependencies install from the committed bun.lock files. There is no
      # npm lockfile — package-lock.json is gitignored, so `npm ci` (and
      # setup-node's npm cache) cannot work here.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd .opencode && bun install --frozen-lockfile)

      - name: Test with vitest
        run: npx vitest run --config tests/vitest.config.ts

      - name: Test process timeouts under Bun
        run: bun run test:cron:bun

      - name: Typecheck cron runner
        working-directory: .opencode
        run: npx tsc --noEmit

  validate-workspace:
    name: Validate workspace structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/workspace/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r scripts/workspace/requirements.txt

      - name: Validate workspace
        run: python scripts/workspace/validate.py

      - name: Health check
        run: python scripts/workspace/health-check.py --quick
