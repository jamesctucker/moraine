name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-only:
    name: Core — git + Python only
    runs-on: ubuntu-latest
    steps:
      # This job is the proof that core needs nothing but git and Python:
      # no bun, no Node. Setup creates the workspace .venv itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup (core, detected harnesses, nothing installed)
        run: bash scripts/setup --yes

      - name: Sync with no packs enabled
        run: .venv/bin/python scripts/moraine sync

      - name: Validate workspace
        run: .venv/bin/python scripts/workspace/validate.py

      - name: Health check
        run: .venv/bin/python scripts/workspace/health-check.py --quick

      - name: Core tests
        run: .venv/bin/python -m pytest tests/ --tb=short -q

      - name: Eval (core golden tasks)
        run: .venv/bin/python scripts/workspace/agent-eval.py

  full:
    name: Full — every pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Actions are pinned to full commit SHAs; major-version tags are mutable.
      # Update pins via Dependabot (github-actions ecosystem, .github/dependabot.yml).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/workspace/requirements.txt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r scripts/workspace/requirements.txt

      - name: Install JS dependencies
        run: |
          bun install --frozen-lockfile
          (cd packs/automation/runner && bun install --frozen-lockfile)

      - name: Enable every pack
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/workspace")
          from manifest import write_manifest
          write_manifest(Path("moraine.yaml"), harnesses=["opencode"])
          EOF
          for pack_yaml in packs/*/pack.yaml; do
            python3 scripts/moraine packs enable "$(basename "$(dirname "$pack_yaml")")"
          done

      - name: Sync
        run: python3 scripts/moraine sync

      - name: Test with pytest
        run: python -m pytest tests/ packs/ --tb=short -q

      - name: Test with vitest
        run: npx vitest run --config packs/automation/vitest.config.ts

      - name: Test process timeouts under Bun
        run: bun run test:cron:bun

      - name: Typecheck cron runner
        working-directory: packs/automation/runner
        run: npx tsc --noEmit

      - name: Lint with ruff
        run: ruff check tests/ scripts/ packs/

      # The directory rename to repos/ must not miss a reference. The
      # CHANGELOG keeps its historical mentions; everything else must
      # say repos/. The pattern is written so this file does not match.
      - name: No stale registry-directory references
        run: |
          if grep -rIn --exclude=CHANGELOG.md --exclude-dir=.git --exclude-dir=.venv \
               --exclude-dir=node_modules --exclude-dir=__pycache__ --exclude-dir=.ruff_cache \
               'work[/]' .; then
            echo "::error::stale reference(s) to the old directory name found above"
            exit 1
          fi

      # setup installs this exact package and version; `opencode-ai` stops at
      # 1.19.x, so a pin that only exists there fails on a fresh machine.
      - name: Pinned OpenCode version exists on npm
        run: npm view "@opencode/cli@$(cat .opencode-version)" version
