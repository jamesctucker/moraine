[project]
name = "moraine"
version = "0.1.0"
description = "A personal workspace for building projects, storing documents, and running agentic AI workflows."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N999",  # module name with hyphens — deliberate workspace convention
    "S603",  # subprocess call — reviewed call sites, arguments are not user input
    "S607",  # partial executable path — pre-existing pattern
]

[tool.ruff.lint.per-file-ignores]
# Tests — assert is expected in tests
"tests/*.py" = ["S101"]
# Deliberately sloppy fixture code for the slop detector — findings there are
# the point, not defects.
"scripts/workspace/slop-fixtures/*.py" = ["S110", "UP024"]
# FTS5 queries assemble WHERE clauses from fixed condition strings; all
# values are bound parameters.
"scripts/workspace/session-index.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
